<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2ecf2">
  <meta name="description" content="Sign in to edit the Anima Med Spa website.">
  <title>Sign in | Anima Med Spa</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/assets/img/medspa/anima-logo-icon-20260729.png" type="image/png">
  <link rel="stylesheet" href="/assets/css/medspa.css">
  <style>
    .admin-shell { min-height: 100svh; display: grid; place-items: center; padding: 32px; }
    .admin-card { width: min(100%, 420px); padding: 40px; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--white); box-shadow: var(--shadow); }
    .admin-card img { width: 68px; height: 68px; border-radius: 50%; }
    .admin-card h1 { margin: 20px 0 8px; font-size: 1.6rem; }
    .admin-card p.lede { margin: 0 0 26px; font-size: 0.95rem; }
    .admin-card .field { margin-bottom: 18px; }
  </style>
</head>
<body class="page-admin">
  <main class="admin-shell">
    <div class="admin-card">
      <img src="/assets/img/medspa/anima-logo-200.jpg" width="200" height="200" alt="Anima Med Spa">
      <h1>Edit your website</h1>
      <p class="lede">Sign in, then click any text on the site to change it. Your edits go live as soon as you click away.</p>

      <form class="contact-form" id="admin-login" novalidate>
        <div class="field">
          <label for="admin-password">Password</label>
          <input id="admin-password" name="password" type="password" autocomplete="current-password" required autofocus>
          <p class="field-error" hidden></p>
        </div>
        <button class="button button-primary" type="submit">Sign in</button>
        <p class="form-status" role="status" aria-live="polite"></p>
      </form>

      <p class="form-fallback" style="margin-top:22px">
        Forgotten the password, or something not working? <a href="/contact-us-light.html">Get in touch</a>.
      </p>
    </div>
  </main>

  <script>
    const form = document.getElementById("admin-login");
    const status = form.querySelector(".form-status");
    const error = form.querySelector(".field-error");
    const input = document.getElementById("admin-password");
    const button = form.querySelector("button");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      error.hidden = true;
      input.setAttribute("aria-invalid", "false");

      if (!input.value) {
        error.textContent = "Please enter the password.";
        error.hidden = false;
        input.setAttribute("aria-invalid", "true");
        input.focus();
        return;
      }

      button.textContent = "Signing in…";
      status.textContent = "";

      try {
        const response = await fetch("/api/admin/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({ password: input.value }),
        });
        const body = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(body.error || "Could not sign in");

        status.textContent = "Signed in. Opening the site…";
        // Land on the homepage with the editor active.
        location.href = "/";
      } catch (err) {
        button.textContent = "Sign in";
        error.textContent = err.message;
        error.hidden = false;
        input.setAttribute("aria-invalid", "true");
        input.select();
      }
    });
  </script>
</body>
</html>
